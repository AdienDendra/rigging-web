name: One-time import of The Mosquito Bowl poster
on:
  push:
    paths:
      - .github/workflows/one-time-import-mosquito-poster.yml
permissions:
  contents: write
jobs:
  import-poster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch poster and verify original uploaded file checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wp-content/uploads/2026/11
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 --silent --show-error \
            'https://m.media-amazon.com/images/M/MV5BNzYzOWQ4ZjYtMmQyMS00Y2YwLWIxNDctZDlhNjcxZDE5MjVhXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg' \
            --output wp-content/uploads/2026/11/theMosquitoBowl.jpg
          echo '3bac0f3a1ee525e1878b2b4852ab1f4cccb6f3971abde23ed8cb5acdc5fa0ed8  wp-content/uploads/2026/11/theMosquitoBowl.jpg' | sha256sum --check --status
      - name: Commit poster and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wp-content/uploads/2026/11/theMosquitoBowl.jpg
          git rm .github/workflows/one-time-import-mosquito-poster.yml
          git commit -m 'Add The Mosquito Bowl poster asset'
          git push origin HEAD:main
